<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Asistenciero Virtual</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header>
        <h1>Escuela de Minas "Dr. Horacio Carrillo"</h1>
        <div class="escudo">
            <img src="img/escudoedm.png" alt="Escudo EDM" width="100">
        </div>
    </header>

    <div class="main-container">
        <div class="form-card">
            <h2>Registrate</h2>
            
            <form onsubmit="procesarRegistro(event)">
                <div class="input-group">
                    <label for="reg-nombre">NOMBRE</label>
                    <input type="text" id="reg-nombre" placeholder="Jimena Martínez" required>
                </div>
                <div class="input-group">
                    <label for="reg-dni">D. N. I.</label>
                    <input type="text" id="reg-dni" placeholder="Ingrese su DNI" required>
                </div>
                <div class="input-group">
                    <label for="reg-email">CORREO ELECTRÓNICO</label>
                    <input type="email" id="reg-email" placeholder="hola@sitioincreible.com.ar" required>
                </div>
                <div class="input-group">
                    <label for="reg-clave">CLAVE</label>
                    <input type="password" id="reg-clave" placeholder="******" required>
                </div>
                <div class="input-group">
                    <label for="reg-ciclo">CICLO RESPONSABLE</label>
                    <select id="reg-ciclo" required>
                        <option value="">Seleccionar</option>
                        <option value="Ciclo Básico">Ciclo Básico</option>
                        <option value="Ciclo Superior">Ciclo Superior</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="reg-curso">CURSO A CARGO</label>
                    <select id="reg-curso" required>
                        <option value="">Marcar</option>
                        <option value="1RO superior o basico">1RO superior o basico</option>
                        <option value="2DO superior o basico">2DO superior o basico</option>
                        <option value="3RO superior o basico">3RO superior o basico</option>
                    </select>
                </div>
                <button type="submit" class="btn-negro">Registrar</button>
            </form>

            <div class="link-text">
                ¿Ya tienes una cuenta? <a href="login.html">Iniciá sesión</a>
            </div>
        </div>
    </div>

    <script>
        function procesarRegistro(event) {
            event.preventDefault();
            const nuevo = {
                nombre: document.getElementById('reg-nombre').value.trim(),
                dni: document.getElementById('reg-dni').value.trim(),
                email: document.getElementById('reg-email').value.trim(),
                clave: document.getElementById('reg-clave').value.trim(),
                ciclo: document.getElementById('reg-ciclo').value,
                curso: document.getElementById('reg-curso').value
            };

            let lista = JSON.parse(localStorage.getItem('db_usuarios')) || [];
            lista.push(nuevo);
            localStorage.setItem('db_usuarios', JSON.stringify(lista));
            localStorage.setItem('sesion_activa', JSON.stringify(nuevo));

            alert("¡Registro guardado con éxito!");
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
