<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio - Asistenciero Virtual</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header>
        <h1>Escuela de Minas "Dr. Horacio Carrillo"</h1>
        <div class="escudo">
            <img src="img/escudoedm.png" alt="Escudo EDM" width="100">
        </div>
    </header>

    <nav class="menu-punteado">
        <a href="dashboard.html" class="activo">INICIO</a>
        <a href="perfil.html">MI PERFIL</a>
        <a href="datos-cursos.html">DATOS DE CURSO</a>
    </nav>

    <div class="inicio-wrapper">
        <div class="titulo-bienvenida" id="titulo-usuario-cargo">
            NOMBRE USUARIO ESTÁ A CARGO DEL CICLO A CARGO
        </div>

        <div class="inicio-contenido">
            <div class="inicio-foto">
                <img src="img/escuelaedm.png" alt="Escuela de Minas Sede La Quiaca">
            </div>

            <div class="inicio-contadores">
                <div class="contador-fila">
                    <label>cantidad de presentes:</label>
                </div>

                <div class="contador-fila">
                    <label>cantidad de ausentes:</label>
                </div>

                <div class="contador-fila">
                    <label>cantidad de tardanzas:</label>
                </div>
            </div>
        </div>

        <button type="button" onclick="cerrarSesion()" class="btn-negro" style="max-width: 180px; margin: 40px auto 0 auto; display: block;">Cerrar Sesión</button>
    </div>

    <script>
        const sesion = JSON.parse(localStorage.getItem('sesion_activa'));
        if (!sesion) {
            window.location.href = 'login.html';
        } else {
            const nombre = sesion.nombre ? sesion.nombre.toUpperCase() : "USUARIO";
            const curso = sesion.curso ? sesion.curso.toUpperCase() : "CURSO ASIGNADO";
            const ciclo = sesion.ciclo ? ` (${sesion.ciclo.toUpperCase()})` : "";
            document.getElementById('titulo-usuario-cargo').innerText = `${nombre} ESTÁ A CARGO DE ${curso}${ciclo}`;
        }

        function cerrarSesion() {
            localStorage.removeItem('sesion_activa');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
