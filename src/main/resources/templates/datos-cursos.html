<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datos de Cursos - Asistenciero Virtual</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header>
        <h1>Escuela de Minas "Dr. Horacio Carrillo"</h1>
        <div class="escudo">
            <img src="img/escudoedm.png" alt="Escudo EDM" width="100">
        </div>
    </header>

    <nav class="menu-punteado">
        <a href="dashboard.html">INICIO</a>
        <a href="perfil.html">MI PERFIL</a>
        <a href="datos-cursos.html" class="activo">DATOS DE CURSO</a>
    </nav>

    <div class="contenido-pagina">
        <div class="panel-lateral-cursos">
            <ul class="acciones-lista">
                <li>
                    <button type="button" class="btn-accion-menu" onclick="abrirModalAlta()">AGREGAR ALUMNO</button>
                </li>
                <li>
                    <button type="button" class="btn-accion-menu" onclick="activarModoBaja()">DAR DE BAJA ALUMNO</button>
                </li>
            </ul>

            <div class="filtro-curso-box">
                <label for="filtro-curso">SELECCIONAR CURSO</label>
                <select id="filtro-curso" onchange="renderizarTabla()">
                    <option value="">Marcar (Todos)</option>
                    <option value="1RO superior o basico">1RO superior o basico</option>
                    <option value="2DO superior o basico">2DO superior o basico</option>
                    <option value="3RO superior o basico">3RO superior o basico</option>
                </select>
            </div>
        </div>

        <div class="tabla-contenedor">
            <div class="buscador-container" id="buscador-container">
                <span class="icono-lupa">🔍</span>
                <input type="text" id="input-buscar" placeholder="Buscar alumno por Nombre, Apellido o DNI..." onkeyup="renderizarTabla()">
            </div>

            <table id="tabla-cursos">
                <thead>
                    <tr>
                        <th>Nº</th>
                        <th>Nombre</th>
                        <th>Apellido</th>
                        <th>D. N. I.</th>
                        <th>Inasistencias totales</th>
                        <th>Tardanzas</th>
                        <th id="columna-accion" class="oculto">Acción</th>
                    </tr>
                </thead>
                <tbody id="tabla-alumnos-body">
                    <!-- Dinámico -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal para Agregar Alumno -->
    <div id="modal-alta" class="modal-fondo oculto">
        <div class="modal-card">
            <h3>Registrar Nuevo Alumno</h3>
            <form id="form-alumno" onsubmit="guardarNuevoAlumno(event)">
                <div class="input-group">
                    <label for="modal-nombre">NOMBRE:</label>
                    <input type="text" id="modal-nombre" required placeholder="Ingrese nombre">
                </div>
                <div class="input-group">
                    <label for="modal-apellido">APELLIDO:</label>
                    <input type="text" id="modal-apellido" required placeholder="Ingrese apellido">
                </div>
                <div class="input-group">
                    <label for="modal-dni">D. N. I.:</label>
                    <input type="text" id="modal-dni" required placeholder="Ingrese DNI">
                </div>
                <div class="input-group">
                    <label for="modal-curso">CURSO:</label>
                    <select id="modal-curso" required>
                        <option value="">Seleccionar curso</option>
                        <option value="1RO superior o basico">1RO superior o basico</option>
                        <option value="2DO superior o basico">2DO superior o basico</option>
                        <option value="3RO superior o basico">3RO superior o basico</option>
                    </select>
                </div>
                <div class="modal-botones">
                    <button type="submit" class="btn-negro">Guardar</button>
                    <button type="button" class="btn-negro btn-cancelar" onclick="cerrarModalAlta()">Cancelar</button>
                </div>
            </form>
        </div>
    </div>
    <script src="js/cursos.js"></script>
    <script src="js/alumnos.js"></script>
</body>
</html>
